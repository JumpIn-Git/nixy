name: cachix

on:
  push:
    branches:
      - main
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-nu@v3

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: "jump1n"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: build all
        shell: nu {0}
        run: |
          nix flake show --json --extra-experimental-features pipe-operators --accept-flake-config | from json | get packages.x86_64-linux -o | columns | each {|p| nix build --extra-experimental-features pipe-operators --accept-flake-config $".#($p)"}
      - name: build nixos
        shell: nu {0}
        run: |
          nix build .#nixosConfigurations.nixos.config.system.build.toplevel --extra-experimental-features pipe-operators --accept-flake-config
