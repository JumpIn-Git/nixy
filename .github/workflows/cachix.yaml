name: cachix

on:
  push:
    branches:
      - main
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-nu@v3

      - id: need-package-build
        uses: tj-actions/changed-files@v44
        with:
          files: |
            pkgs/**
            wrappedPrograms/**
      - id: need-nixos-build
        uses: tj-actions/changed-files@v44
        with:
          files: |
            nixos/**

      - uses: cachix/install-nix-action@v31
        if: steps.need-package-build.outputs.any_changed == 'true' || steps.need-nixos-build.outputs.any_changed == 'true'
      - uses: cachix/cachix-action@v17
        if: steps.need-package-build.outputs.any_changed == 'true' || steps.need-nixos-build.outputs.any_changed == 'true'
        with:
          name: "jump1n"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: build packages
        if: steps.need-package-build.outputs.any_changed == 'true'
        shell: nu {0}
        run: |
          nix flake show --json --extra-experimental-features pipe-operators --accept-flake-config | from json | get packages.x86_64-linux -o | columns | each {|p| nix build --extra-experimental-features pipe-operators --accept-flake-config $".#($p)"}
      - name: build nixos
        if: steps.need-nixos-build.outputs.any_changed == 'true'
        shell: nu {0}
        run: |
          nix build .#nixosConfigurations.nixos.config.system.build.toplevel --extra-experimental-features pipe-operators --accept-flake-config
